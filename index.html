<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18181D">
<meta name="description" content="Make your own card deck or a photo memory game and print it at home: write your cards or import a spreadsheet, add pictures, export a double-sided PDF with crop marks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Deck Print</title>
<link rel="stylesheet" href="fonts.css">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Layout: print-shop workbench. Header with the press actions; settings in tabbed steps on the left; the proof lies on a green cutting mat (cm grid) on the right, with the selected card shown big, front and back. CMY registration colours as accents. */
:root{
  --paper:#F1EFE9; --panel:#FFFFFF; --ink:#18181D; --muted:#686873; --rule:#E2DFD7; --soft:#F5F3EE; --field:#FAF9F6;
  --mat:#2E6A57; --mat-deep:#245646; --matline:rgba(255,255,255,.10); --matline2:rgba(255,255,255,.22); --matink:#E9F2EC;
  --cyan:#0089C7; --magenta:#D6297A; --yellow:#F2B705; --ok:#1E8E5A;
  --shadow:0 1px 2px rgba(24,24,29,.06), 0 8px 28px rgba(24,24,29,.08);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121215; --panel:#1B1B20; --ink:#ECEBE6; --muted:#A3A2AB; --rule:#2F2F37; --soft:#232329; --field:#16161A;
  --mat:#1F4A3D; --mat-deep:#183B31; --matline:rgba(255,255,255,.07); --matline2:rgba(255,255,255,.16); --matink:#D6E6DC;
  --cyan:#4FB8EA; --magenta:#EE6AA7; --yellow:#F5C842; --ok:#53C28B; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121215; --panel:#1B1B20; --ink:#ECEBE6; --muted:#A3A2AB; --rule:#2F2F37; --soft:#232329; --field:#16161A;
  --mat:#1F4A3D; --mat-deep:#183B31; --matline:rgba(255,255,255,.07); --matline2:rgba(255,255,255,.16); --matink:#D6E6DC;
  --cyan:#4FB8EA; --magenta:#EE6AA7; --yellow:#F5C842; --ok:#53C28B; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
/* Inside an iframe (itch.io loads games with scrolling="no") the page itself cannot scroll, so the app scrolls inside its own container instead. */
html.embedded,html.embedded body{height:100%;overflow:hidden}
html.embedded .wrap{height:100%;overflow-y:auto;overscroll-behavior:contain}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ic{padding:8px 10px}.btn.ic:disabled{opacity:.35;cursor:default}
.pf{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:.82rem}
.pf li{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;background:var(--soft)}
.pf li b{flex:none;width:18px;text-align:center}
.pf .err{background:#FBE3DF;color:#7A1F12}.pf .warn{background:#FFF1CC;color:#5B4300}.pf .ok{background:#DDF3E5;color:#14532D}
.pf small{display:block;opacity:.85;margin-top:2px;word-break:break-word}
.libw{position:absolute;left:3px;bottom:22px;background:#E8A500;color:#18181D;border-radius:10px;font-size:.62rem;font-weight:700;padding:1px 6px;line-height:1.5}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;padding:8px 10px;font-size:.82rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}

/* main grid */
.grid{display:grid;grid-template-columns:var(--lw,430px) 14px minmax(0,1fr);gap:0;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.side .tabs{flex:none}
.side .pane{overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.pane>*{flex-shrink:0}
.split{align-self:stretch;cursor:col-resize;position:relative;touch-action:none;min-height:120px}
.split::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);border-radius:3px;background:transparent;transition:background .15s}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:var(--cyan)}
.split::before{content:"";position:sticky;top:calc(50vh - 18px);display:block;margin:0 auto;width:4px;height:36px;border-radius:3px;background:var(--rule)}
@media (max-width:960px){.grid{grid-template-columns:1fr;gap:16px}.split{display:none}.side{position:static;max-height:none;overflow:visible}.side .pane{overflow:visible}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--rule);overflow:hidden;container-type:inline-size}
.tab{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:8px 3px;display:flex;align-items:center;gap:5px;justify-content:center;font-weight:600;font-size:.8rem;color:var(--muted)}
.tab .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@container (max-width:395px){.tab[aria-selected="false"] .l{display:none}.tab[aria-selected="true"]{flex:2.4 1 0}}
.tab .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:#fff;flex:none}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.tab:nth-child(1) .n{background:var(--cyan)} .tab:nth-child(2) .n{background:var(--magenta)} .tab:nth-child(3) .n{background:var(--yellow);color:#18181D} .tab:nth-child(4) .n{background:#18181D} .tab:nth-child(5) .n{background:var(--ok)}
.pane{padding:16px;display:flex;flex-direction:column;gap:14px}
.pane h2{font-family:var(--f-display);font-size:1.15rem;margin:0;font-weight:800;letter-spacing:-.01em}
.lead{margin:-6px 0 0;color:var(--muted);font-size:.86rem}
.group{display:flex;flex-direction:column;gap:9px}
.glabel{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 90px;min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:130px;font-family:var(--f-mono);font-size:.76rem;resize:vertical;white-space:pre;line-height:1.5}
.chk{display:flex;gap:8px;align-items:center;font-size:.86rem}
.ced{border-bottom:1px solid var(--rule);background:var(--paper)}
.ced{padding:10px 16px}
.ced summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);border:1.5px solid var(--ink);margin-bottom:10px}
.ced summary::-webkit-details-marker{display:none}
.ced summary:hover{background:var(--field)}
.ced .edic{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:0 0 34px}
.ced .edic svg{width:17px;height:17px}
.ced .edtx{display:flex;flex-direction:column;min-width:0;flex:1}
.ced .edtx b{font-size:.92rem}
.ced .edtx small{color:var(--muted);font-size:.78rem;line-height:1.3}
.ced .edpill{background:var(--ink);color:var(--paper);border-radius:999px;padding:5px 13px;font-size:.8rem;font-weight:700;white-space:nowrap}
.ced .edpill .c{display:none}
.ced details[open] .edpill .o{display:none}
.ced details[open] .edpill .c{display:inline}
.ced .edact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 0 10px}
.ced .edgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 10px;padding:0 0 12px}
.ced .wide{grid-column:1/-1}
.ced textarea{min-height:64px;font-family:inherit;font-size:.85rem;white-space:pre-wrap;resize:vertical;line-height:1.4}
.ced .edimg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ced .edimg img{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.ced .hint{padding:0 0 10px}
.mat.dropping{outline:3px dashed var(--cyan);outline-offset:-8px}
.adv{margin-top:10px;border:1px solid var(--line,#d9d6cc);border-radius:12px;padding:8px 12px}.adv .advt{display:block;font-size:.86rem;margin-bottom:4px}
.nudge{display:flex;gap:4px;align-items:stretch}
.nudge input{text-align:center;min-width:0;flex:1 1 auto}
.nudge button{border:1px solid var(--rule);background:var(--field);border-radius:8px;width:34px;flex:0 0 34px;font-size:1.05rem;font-weight:700;line-height:1;color:var(--ink)}
.nudge button:active{background:var(--soft)}
.nudge button.big{width:44px;flex:0 0 44px;font-size:.7rem;font-weight:600;color:var(--muted)}
.nudge button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.nudge input.sel{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 35%,transparent)}
.nudge input.armed{background:color-mix(in srgb,var(--cyan) 28%,var(--field));border-color:var(--cyan);font-weight:700}
.zoom{display:flex;flex-direction:column;gap:8px;margin-top:8px}.zrow{gap:2px}.zctl{display:flex;align-items:center;gap:8px}.zctl input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--ink)}.zctl input[type=number]{flex:0 0 68px;width:68px}.zctl i{font-style:normal;color:var(--muted);font-size:.8rem}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-mono);font-size:.72rem;background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:2px 7px}
.drop{border:1.5px dashed var(--rule);border-radius:11px;padding:14px;text-align:center;color:var(--muted);font-size:.84rem;background:var(--field)}
.drop.over{border-color:var(--cyan);color:var(--ink)}
.drop b{color:var(--ink)}
.slot{border:1px solid var(--rule);border-radius:11px;background:var(--field)}
.slot>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px;font-weight:600;font-size:.88rem}
.slot>summary::-webkit-details-marker{display:none}
.slot>summary .dot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:none}
.slot.on>summary .dot{background:var(--ok)}
.slot>summary .what{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .in{padding:0 11px 11px;display:flex;flex-direction:column;gap:8px}
.protag{font-size:.68rem;background:var(--accent,#2F6FB0);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.glabel.sub{font-weight:500;opacity:.85;margin-top:4px}
.prolock .swatches,.prolock .zrow{opacity:.5}
.swatches{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rule);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:26px;height:26px;border:1px solid var(--rule);border-radius:50%;padding:0;background:none;overflow:hidden}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.theme{border:1.5px solid var(--rule);background:var(--field);border-radius:11px;padding:7px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.74rem;font-weight:600;color:var(--muted)}
.theme canvas{width:100%;max-width:70px;height:auto;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.theme[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:7px 11px;color:var(--muted);font-weight:600;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.full{display:flex}.seg.full button{flex:1}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--yellow));width:0;transition:width .2s}
.sizegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.size{border:1.5px solid var(--rule);background:var(--field);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)}
.size i{display:block;border:1.5px solid currentColor;border-radius:3px}
.size[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.82rem}
.info svg{width:18px;height:18px;flex:none;color:var(--cyan);margin-top:1px}

/* stage (cutting mat) */
.stage{overflow:clip}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:3;background:var(--panel)}
.stat{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.mat{position:relative;background:var(--mat);min-height:560px;padding:22px;color:var(--matink);
  background-image:linear-gradient(var(--matline2) 1px,transparent 1px),linear-gradient(90deg,var(--matline2) 1px,transparent 1px),linear-gradient(var(--matline) 1px,transparent 1px),linear-gradient(90deg,var(--matline) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
.spot{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 0 22px}
.spot figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.spot canvas{height:min(340px,52vw);width:auto;max-width:100%;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25)}
.spot figcaption,.cap{font-family:var(--f-mono);font-size:.74rem;color:var(--matink);opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.spotnav{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:-8px;margin-bottom:16px}
.spotnav button{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.15);color:var(--matink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.spotnav button svg{width:16px;height:16px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;border-top:1px dashed rgba(255,255,255,.25);padding-top:18px}
.thumbs button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--matink)}
.thumbs canvas{width:100%;height:auto;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s}
.thumbs button:hover canvas{transform:translateY(-3px)}
.thumbs button[aria-current="true"] canvas{outline:3px solid var(--yellow);outline-offset:2px}
.thumbs span{font-family:var(--f-mono);font-size:.68rem;opacity:.8}
.sheetwrap{display:flex;justify-content:center;padding:6px 0}
.sheetwrap canvas{max-width:100%;height:auto;max-height:76vh;width:auto;box-shadow:0 18px 40px rgba(0,0,0,.4);background:#fff}
.empty{display:grid;place-items:center;min-height:480px;text-align:center}
.empty .hint{color:inherit;opacity:.8;margin:8px 0 12px}
.empty p{max-width:34ch;font-size:1.05rem}
/* memory di famiglia */
.memo{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--soft);border:1.5px solid var(--ink)}
.memo[hidden]{display:none}
.memo>svg{width:46px;height:46px;flex:none}
.memo .mt{display:flex;flex-direction:column;min-width:0;flex:1 1 240px;gap:1px}
.memo .mt b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:-.01em}
.memo .mt span{color:var(--muted);font-size:.86rem;line-height:1.35}
#memDlg{border:0;border-radius:16px;padding:0;max-width:700px;width:calc(100% - 32px);max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--panel);color:var(--ink)}
#memDlg[open]{display:flex;flex-direction:column}
#memDlg::backdrop{background:rgba(20,20,24,.55)}
.mhead{padding:18px 18px 4px;display:flex;flex-direction:column;gap:12px;flex:none}
.mhead h3{font-family:var(--f-display);font-size:1.3rem;margin:0;letter-spacing:-.01em}
.mst{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.mst li{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:9px}
.mst li .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:#fff;flex:none}
.mst li:nth-child(1) .n{background:var(--cyan)}.mst li:nth-child(2) .n{background:var(--magenta)}.mst li:nth-child(3) .n{background:var(--yellow);color:#18181D}
.mst li[aria-current="step"]{background:var(--soft);color:var(--ink)}
.mbody{padding:12px 18px 14px;overflow:auto;flex:1 1 auto;min-height:min(400px,60dvh);display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.mbody>*{flex-shrink:0}
.mbody .lead{margin:0}
.mfoot{padding:12px 18px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);flex:none}
.mfoot .r{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.mdrop{padding:26px 14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.mph{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.mph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--rule);background:var(--soft)}
.mph input{padding:5px 7px;font-size:.78rem}
.mph .libadd{width:100%}
.mbacks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mback{border:1.5px solid var(--rule);background:var(--field);border-radius:11px;padding:8px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--muted)}
.mback canvas{width:100%;max-width:84px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.mback[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.mprev{display:flex;gap:22px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:18px 14px 12px;background:var(--mat);color:var(--matink);border-radius:12px;
  background-image:linear-gradient(var(--matline2) 1px,transparent 1px),linear-gradient(90deg,var(--matline2) 1px,transparent 1px),linear-gradient(var(--matline) 1px,transparent 1px),linear-gradient(90deg,var(--matline) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.mprev figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.mprev canvas{height:min(200px,38vw);width:auto;max-width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.mprev.mini{position:sticky;top:0;z-index:3;padding:8px 10px 6px;gap:18px;margin-bottom:4px}.mprev.mini canvas{height:min(116px,24vw)}.mprev.mini figcaption{font-size:.62rem}

.seg button small.dim{display:block;font-family:var(--f-mono);font-size:.68rem;font-weight:500;opacity:.8}
.msum{font-family:var(--f-display);font-weight:800;font-size:1.05rem;margin:0}
@media (max-width:520px){.mbacks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);z-index:9;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.thumbs canvas{transition:none}}
.btn.pro{background:linear-gradient(135deg,#F2B705,#E08A00);color:#1d1600;border-color:transparent;font-weight:700}
#proDlg{border:0;border-radius:16px;padding:0;max-width:420px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--panel);color:var(--ink)}
#proDlg::backdrop{background:rgba(20,20,24,.55)}
#proDlg form{padding:22px 22px 18px}
#proDlg h3{font-family:var(--f-display);font-size:1.3rem;margin:0 0 8px}
#proDlg p{margin:0 0 10px;color:var(--muted);line-height:1.45}
#proDlg ul{margin:0 0 12px;padding-left:20px;line-height:1.6}

.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.getapp{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;text-align:center;padding:12px 14px;border-radius:12px;background:var(--soft);border:1.5px solid var(--ink);font-size:.92rem;line-height:1.4}
.getapp[hidden]{display:none}
.getapp a{font-weight:700;color:var(--ink)}
/* libreria immagini */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px;border:1.5px dashed var(--rule);border-radius:11px;padding:9px;background:var(--field);max-height:250px;overflow:auto}
.lib.over{border-color:var(--cyan)}
.libi{position:relative;display:flex;flex-direction:column;gap:3px;font-size:.62rem;color:var(--muted);min-width:0}
.libi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--rule);background:var(--soft)}
.libi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.68);color:#fff;font-size:.95rem;line-height:1;padding:0;display:grid;place-items:center}
.libadd{aspect-ratio:1;border:1.5px dashed var(--muted);border-radius:6px;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.libadd small{font-size:.62rem;font-weight:600}
.libadd:hover{border-color:var(--ink);color:var(--ink)}
#imgDlg{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--panel);color:var(--ink)}
#imgDlg::backdrop{background:rgba(20,20,24,.55)}
#imgDlg .in{padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px}
#imgDlg h3{font-family:var(--f-display);font-size:1.25rem;margin:0}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:2px}
.pk{border:1.5px solid var(--rule);background:var(--field);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:4px;font-size:.66rem;color:var(--muted);min-width:0;text-align:center}
.pk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk:hover,.pk[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.ced .edimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding-bottom:10px}
.ced .edimgcell{display:flex;flex-direction:column;gap:6px;background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.ced .edimgcell .edimg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ced .edimgcell .noimg{width:46px;height:46px;border-radius:6px;border:1.5px dashed var(--rule);flex:none}

async function storeService(){

function parseTable(text){
  text = text.replace(/\r\n?/g,"\n").replace(/\n+$/,"");
  if(!text.trim()) return {headers:[], rows:[]};
  const first = text.split("\n")[0];
  const d = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const out=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"' && cur==="") q=true;
    else if(ch===d){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); out.push(row); row=[]; cur=""; }
    else cur+=ch; }
  row.push(cur); out.push(row);
  const headers = out.shift().map((h,i)=>h.trim()||`col${i+1}`);
  const rows = out.filter(r=>r.some(c=>c.trim())).map(r=>headers.map((_,i)=>(r[i]||"").trim()));
  return {headers, rows};
}

  const note=(name,wmm,hmm,fit)=>{ const k=imgKey(name); if(!k) return; const im=getImage(k); if(!im||!im.width) return;
    const r=fit==="contain"?Math.min(wmm/im.width,hmm/im.height):Math.max(wmm/im.width,hmm/im.height); const dpi=25.4/r; if(!(k in out)||dpi<out[k]) out[k]=dpi; };
  rows.forEach(ri=>{ const row=S.data.rows[ri]; if(!row) return;
    if(S.front.image.field) S.front.fullImage ? note(val(row,S.front.image.field), W+2*b, H+2*b, "cover") : note(val(row,S.front.image.field), W-2*pad, (H-2*pad)*S.front.image.h/100, "cover");
    if(S.back.mode==="uniform"){
      const own=S.back.imgCol?String(val(row,S.back.imgCol)||"").trim():"", hasText=!!S.back.text;
      const nm=own||S.back.logoKey; if(!nm) return;
      if(S.back.imgFit==="cover") note(nm, W+2*b, H+2*b, "cover"); else note(nm, W*0.62, hasText?H*0.42:H*0.6, "contain");
    } else if(S.back.image.field) note(val(row,S.back.image.field), W-2*pad, (H-2*pad)*S.back.image.h/100, "cover");

}
function preflight(){
  const l=L(), items=[], n=S.data.rows.length;

  const lo=layout(), b=S.print.bleed;
  if(lo.n<1){ items.push({t:"err", m:l.pfNoFit(+(S.card.w+2*b).toFixed(1), +(S.card.h+2*b).toFixed(1), S.print.page)}); return items; }
  const d=deck(); items.push({t:"info", m:l.pfSheets(d.length, lo.n, Math.ceil(d.length/lo.n))});
  const used=[...new Set(d)], cols=[S.front.image.field, S.back.mode==="uniform"?S.back.imgCol:S.back.image.field].filter((c,i,x)=>c && colIdx(c)>=0 && x.indexOf(c)===i), miss=new Set(); let missRows=0;
  used.forEach(ri=>{ let hit=false; cols.forEach(c=>{ const v=String(val(S.data.rows[ri],c)||"").trim(); if(v && !imgKey(v)){ miss.add(v); hit=true; } }); if(hit) missRows++; });
  { const fi=S.front.image.field; if(fi && colIdx(fi)>=0){ const np=used.filter(ri=>!String(val(S.data.rows[ri],fi)||"").trim()).length; if(np) items.push({t:"warn", m:l.pfNoPic(np)}); } }
  if(missRows) items.push({t:"warn", m:l.pfMissing(missRows, [...miss].slice(0,6).join(", ")+(miss.size>6?"…":""))});
  const u=imgUsage(), nm=k=>`${k.replace(/\.[a-z0-9]+$/,"")} (${Math.round(u[k])} dpi)`;
  const blur=Object.keys(u).filter(k=>u[k]<100), low=Object.keys(u).filter(k=>u[k]>=100&&u[k]<150);
  if(blur.length) items.push({t:"err2", m:l.pfBlur(blur.slice(0,6).map(nm).join(", ")+(blur.length>6?"…":""))});
  if(low.length) items.push({t:"warn", m:l.pfLow(low.slice(0,6).map(nm).join(", ")+(low.length>6?"…":""))});
  if(!items.some(i=>i.t==="warn"||i.t==="err"||i.t==="err2")) items.push({t:"ok", m:l.pfOk});

}
function renderPreflight(){

function histFp(sn){ return sn.raw+"\u0001"+sn.card+sn.front+sn.back+sn.print+"\u0001"+Object.keys(sn.images).map(k=>k+":"+sn.images[k].length).join(","); }

function histWatch(){

function histApply(sn){

    if(dl){ await dl.save({filename:name, data:blob}); return true; } }catch(e){ if(e && e.code==="declined") return false; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true; }catch(e){ toast(L().dlFail); return false; }
}

    el.addEventListener("blur", ()=>{ if(refocusing||retried||Date.now()-downAt>1200) return; retried=true; refocusing=true; setTimeout(()=>{ try{ window.focus(); }catch(e){} if(document.activeElement===el) el.blur(); el.focus({preventScroll:true}); setTimeout(()=>{ refocusing=false; },60); },30); });
    const arm=on=>{ armed=on; el.classList.toggle("armed", on); };
    el.addEventListener("mousedown", ()=>{ wasFocused=(document.activeElement===el); });
    el.addEventListener("focus", ()=>{ mark(); arm(!wasFocused); });
    el.addEventListener("blur", ()=>{ arm(false); wasFocused=false; });
    el.addEventListener("mouseup", ()=>{ if(wasFocused) arm(false); });
    const MX=()=>parseFloat(el.dataset.max)||10, ST=()=>parseFloat(el.dataset.st)||0.05;

    el.addEventListener("input", ()=>{ const n=parseOff(el.value,MX()); if(n!==null){ setPath(k,n); scheduleRender(); } });
    const fix=()=>{ const n=parseOff(el.value,MX()); const v = n===null ? (k.split(".").reduce((o,x)=>o[x],S)||0) : n; setPath(k,v); el.value=fmtOff(v); scheduleRender(); };
    el.addEventListener("blur", fix);
    el.addEventListener("keydown", e=>{ if(["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) arm(false); if(e.key==="Enter"){ e.preventDefault(); fix(); } if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); fix(); const cur=k.split(".").reduce((o,x)=>o[x],S)||0; const v=Math.max(-MX(),Math.min(MX(),Math.round((cur+(e.key==="ArrowUp"?ST():-ST()))*100)/100)); setPath(k,v); el.value=fmtOff(v); scheduleRender(); } });
  });
  document.querySelectorAll("[data-nd]").forEach(b=>{

    let t1=null, t2=null; const stop=()=>{ clearTimeout(t1); clearInterval(t2); };
    b.addEventListener("pointerdown", e=>{ e.preventDefault(); step(); t1=setTimeout(()=>{ t2=setInterval(step,100); },450); });
    ["pointerup","pointerleave","pointercancel","blur"].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener("click", e=>{ if(e.detail===0) step(); });
  });
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{ setPath(b.dataset.sw, b.dataset.c); b.parentElement.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed", x===b)); b.parentElement.querySelector("input[type=color]").value=b.dataset.c; scheduleRender(); });

    if(k==="back.mode" && v==="data" && S.back.imgCol && colIdx(S.back.imgCol)>=0 && !S.back.image.field){ S.back.image.field=S.back.imgCol; if(!S.back.image.h) S.back.image.h=42; }
    if(/[mM]ode$|duplex$|frame$|imgFit$|textBand$|capPos$/.test(k)){ buildPanel(); syncEditor(true); }
    scheduleRender(); });
  document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ themeTo(b.dataset.side, b.dataset.theme); if(b.dataset.side==="front" && S.back.mode==="data") autoConfigBack(b.dataset.theme); buildPanel(); scheduleRender(); });
